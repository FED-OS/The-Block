<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="The Block">
  <!-- The Block favicon: brand mark - tilted green tile, white B, acid glow -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8be0ae"/>
      <stop offset="1" stop-color="#55bd87"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.62" stop-color="#c6ff3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- dark paper background (site paper color) -->
  <rect width="128" height="128" rx="24" fill="#111916"/>

  <!-- acid halo behind the tile (brand box-shadow glow) -->
  <ellipse cx="64" cy="64" rx="66" ry="66" fill="url(#halo)" filter="url(#soft)"/>

  <!-- tilted brand tile with the B -->
  <g transform="rotate(-6 64 64)">
    <rect x="18.0" y="18.0" width="92" height="92" rx="23" fill="url(#tile)"/>
    <path d="M722 519Q722 392 607 359V355Q738 325 738 183Q738 129 711.5 87.5Q685 46 639.0 23.0Q593 0 538 0H74V688H532Q584 688 627.5 666.5Q671 645 696.5 606.0Q722 567 722 519ZM295 420H447Q469 420 483.5 435.5Q498 451 498 474V484Q498 506 483.0 521.5Q468 537 447 537H295ZM295 160H463Q485 160 499.5 175.5Q514 191 514 214V224Q514 247 499.5 262.5Q485 278 463 278H295Z" fill="#ffffff" transform="translate(28.593 94.000) scale(0.087209 -0.087209)"/>
  </g>
</svg>
